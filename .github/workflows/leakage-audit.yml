name: GridSentinel leakage audit

on:
  pull_request:
  push:

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/leakage_audit.py --checks-only
      - run: python -m pytest backend/tests/test_leakage_audit.py backend/tests/test_research_data_guard.py -q
